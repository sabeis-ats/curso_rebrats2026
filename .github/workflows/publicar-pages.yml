name: Publicar livro e curso no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: |
            any::rmarkdown
            any::knitr
            any::curl
            any::data.table
            any::ggplot2

      - name: Renderizar livro Quarto
        run: quarto render

      - name: Executar aula R Markdown
        shell: Rscript {0}
        run: |
          dir.create("_book/curso", recursive = TRUE, showWarnings = FALSE)
          rmarkdown::render(
            "curso_rebrats2026.Rmd",
            output_file = "index.html",
            output_dir = "_book/curso",
            params = list(
              tentar_sftp = FALSE,
              baixar_dicionario = FALSE,
              instalar_pacotes = FALSE,
              limite_registros = 20000
            ),
            envir = new.env(parent = globalenv()),
            clean = TRUE
          )

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
